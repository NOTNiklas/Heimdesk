<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HeimDesk — Service Desk</title>
<meta name="description" content="Interner Service-Desk: Tickets erstellen, bearbeiten und verwalten.">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/luxury-design-system-be25ffed-e9f1-4dd7-8ade-79b64a54ef5a/tokens/fonts.css">
<link rel="stylesheet" href="_ds/luxury-design-system-be25ffed-e9f1-4dd7-8ade-79b64a54ef5a/tokens/luxury.css">
<link rel="stylesheet" href="_ds/luxury-design-system-be25ffed-e9f1-4dd7-8ade-79b64a54ef5a/styles.css">
<script src="_ds/luxury-design-system-be25ffed-e9f1-4dd7-8ade-79b64a54ef5a/_ds_bundle.js"></script>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:#000;font-family:'Cormorant Garamond',Garamond,serif;color:#cccccc;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  a{color:#c3d9f3;text-decoration:none}
  a:hover{color:#ffffff}
  input,select,textarea,button{font-family:inherit;color:inherit}
  button{cursor:pointer}
  select option{background:#0d0d0d;color:#fff}
  ::placeholder{color:#666666}
  @keyframes hd-spin{to{transform:rotate(360deg)}}
  @keyframes hd-rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes hd-fade{from{opacity:0}to{opacity:1}}
  @keyframes hd-drawer{from{transform:translateX(-100%)}to{transform:none}}
  @keyframes hd-viewin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes hd-shimmer{0%{background-position:-460px 0}100%{background-position:460px 0}}
  @keyframes hd-stagger{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes hd-pulse{0%,100%{opacity:.55}50%{opacity:1}}
  @keyframes hd-pushin{from{opacity:0;transform:translateY(-120%)}to{opacity:1;transform:none}}
  .lx-view{animation:hd-viewin .42s cubic-bezier(.2,.75,.25,1) both}
  .lx-btn{transition:background .2s cubic-bezier(.2,.75,.25,1),color .2s,border-color .2s,transform .16s cubic-bezier(.3,1.4,.5,1),letter-spacing .2s,box-shadow .2s ease}
  .lx-btn:hover{background:rgba(255,255,255,.07);color:#fff;letter-spacing:2.6px;transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,.35)}
  .lx-btn:active{transform:scale(.94)}
  .lx-row{transition:background .18s cubic-bezier(.2,.75,.25,1),transform .18s cubic-bezier(.2,.75,.25,1),color .18s}
  .lx-row:hover{background:#0d0d0d !important;transform:translateX(6px)}
  /* Ticket-Zeilen/-Karten laufen zusätzlich über eine hd-stagger-Eintritts­animation, die den transform-Wert per fill-mode dauerhaft belegt -
     daher hier stattdessen ein Slide über padding-left (per CSS-Variable, konfliktfrei) */
  .lx-row-grid{transition:background .18s cubic-bezier(.2,.75,.25,1),padding-left .18s cubic-bezier(.2,.75,.25,1)}
  .lx-row-grid:hover{padding-left:calc(var(--pl, 20px) + 6px) !important}
  .lx-card-row{transition:background .18s cubic-bezier(.2,.75,.25,1),padding-left .18s cubic-bezier(.2,.75,.25,1),border-color .18s ease}
  .lx-card-row:hover{background:#0d0d0d !important;padding-left:calc(var(--pl, 18px) + 6px) !important}
  .lx-skel{background:linear-gradient(90deg,#141414 0%,#1f1f1f 24%,#141414 48%);background-size:920px 100%;animation:hd-shimmer 1.25s linear infinite}
  .lx-fab{transition:transform .16s cubic-bezier(.3,1.4,.5,1),border-color .2s,color .2s,box-shadow .2s ease}
  .lx-fab:hover{transform:scale(1.08) rotate(-8deg);box-shadow:0 0 0 6px rgba(255,255,255,.05)}
  .lx-fab:active{transform:scale(.9)}
  .lx-spin{transition:transform .6s cubic-bezier(.4,0,.2,1)}
  /* Top-Nav (Desktop): sanft einschiebende Unterstreichung + Aufhellen beim Hover */
  .lx-nav-btn{position:relative;transition:color .18s ease,letter-spacing .18s ease}
  .lx-nav-btn::after{content:'';position:absolute;left:2px;right:2px;bottom:-1px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .3s cubic-bezier(.4,0,.2,1)}
  .lx-nav-btn:hover{color:#ffffff !important;letter-spacing:2.4px}
  .lx-nav-btn:hover::after{transform:scaleX(1)}
  /* Nav-Drawer (Mobile): leichtes Aufhellen + Slide nach rechts */
  .lx-nav-drawer-btn{transition:background .18s ease,padding-left .18s cubic-bezier(.2,.75,.25,1)}
  .lx-nav-drawer-btn:hover{background:#161616 !important;padding-left:16px !important}
  /* Suche: sanftes Aufweiten + Glow beim Fokussieren (Desktop) */
  .lx-search{transition:width .3s cubic-bezier(.4,0,.2,1),box-shadow .2s ease,border-color .2s ease}
  .lx-search:focus{width:270px !important;box-shadow:0 1px 0 0 #ffffff;border-color:#ffffff !important;outline:none}
  .lx-search-wrap:focus-within .lx-search-icon{color:#ffffff !important}
  .lx-search-icon{transition:color .2s ease}
  .lx-search-mobile{transition:box-shadow .2s ease,border-color .2s ease}
  .lx-search-mobile:focus{box-shadow:0 1px 0 0 #ffffff;border-color:#ffffff !important;outline:none}
  .hd-sc{scrollbar-width:thin;scrollbar-color:#3a3a3a transparent}
  .hd-sc::-webkit-scrollbar{height:9px;width:9px}
  .hd-sc::-webkit-scrollbar-thumb{background:#3a3a3a}
  .hd-sc::-webkit-scrollbar-track{background:transparent}
  #root,body{max-width:100%;overflow-x:hidden}
  .lx-main{max-width:1200px;margin:0 auto;padding:40px 40px 140px}
  .lx-main h1{overflow-wrap:break-word;word-break:break-word}

  /* ---------- Klaus ---------- */
  @keyframes ai-pulse-dot{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.5);opacity:1}}
  @keyframes ai-panel-in{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
  @keyframes ai-blink{0%,50%{opacity:1}51%,100%{opacity:0}}
  @keyframes ai-bounce{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-5px);opacity:1}}
  @keyframes ai-ring{0%{box-shadow:0 0 0 0 rgba(192,85,63,.5)}100%{box-shadow:0 0 0 10px rgba(192,85,63,0)}}
  .ai-trigger{transition:border-color .18s ease,background .18s ease}
  .ai-trigger:hover{border-color:#fff !important;background:rgba(255,255,255,.06) !important}
  .ai-badge{display:inline-flex;align-items:center;gap:3px}
  .ai-badge-dot{width:5px;height:5px;border-radius:9999px;background:#c3d9f3;animation:ai-pulse-dot 1.8s ease-in-out infinite}
  .ai-badge-dot:nth-child(2){animation-delay:.2s}
  .ai-badge-dot:nth-child(3){animation-delay:.4s}
  .ai-badge-active .ai-badge-dot{background:#c0553f}
  .ai-mark{display:block;color:#c3d9f3;transition:color .2s ease}
  .ai-mark-active{color:#c0553f;animation:ai-pulse-dot 1.6s ease-in-out infinite}
  .ai-mic-active{animation:ai-ring 1.1s ease-out infinite}
  .ai-cursor{display:inline-block;width:2px;height:15px;background:#fff;margin-left:2px;vertical-align:middle;animation:ai-blink 1s step-start infinite}
  .ai-dots{display:flex;gap:5px;padding:6px 0}
  .ai-dots span{width:6px;height:6px;border-radius:9999px;background:#999;animation:ai-bounce 1.3s ease-in-out infinite}
  .ai-dots span:nth-child(2){animation-delay:.15s}
  .ai-dots span:nth-child(3){animation-delay:.3s}
  .ai-bubble-ai{}
  .ai-md{font-family:'Cormorant Garamond',Garamond,serif;font-size:15.5px;line-height:1.6;color:#e6e6e6}
  .ai-md p{margin:0 0 10px}
  .ai-md p:last-child{margin-bottom:0}
  .ai-md strong{color:#fff;font-weight:700}
  .ai-md ul,.ai-md ol{margin:6px 0 10px;padding-left:22px}
  .ai-md li{margin:3px 0}
  .ai-md a{color:#c3d9f3;text-decoration:underline}
  .ai-md h1,.ai-md h2,.ai-md h3{font-family:'Saira Condensed',sans-serif;font-weight:400;letter-spacing:.5px;color:#fff;margin:14px 0 8px}
  .ai-md h1{font-size:22px}.ai-md h2{font-size:19px}.ai-md h3{font-size:16px}
  .ai-md code{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px;background:rgba(255,255,255,.08);padding:1px 5px;border-radius:4px}
  .ai-md pre{background:#0a0a0a;border:1px solid #262626;border-radius:8px;padding:12px 14px;overflow:auto;margin:8px 0}
  .ai-md pre code{background:none;padding:0;font-size:12px;line-height:1.55}
  .ai-md table{border-collapse:collapse;width:100%;margin:10px 0;font-size:13px}
  .ai-md th,.ai-md td{border:1px solid #333;padding:6px 10px;text-align:left}
  .ai-md th{background:rgba(255,255,255,.06);font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:#999}
  .ai-md blockquote{margin:8px 0;padding:4px 14px;border-left:2px solid #c3d9f3;color:#999}
  .ai-md img{max-width:100%;border-radius:6px}

  @media(max-width:820px){
    .lx-main{padding:20px 16px 130px}
    .lx-main h1{font-size:30px !important;letter-spacing:.5px !important}
    .lx-fld{flex:1 1 100% !important;min-width:0 !important}
    .lx-main input,.lx-main select,.lx-main textarea{max-width:100%}
  }
</style>
</helmet>
<div style="min-height:100vh;background:#000">

  <sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
    <header style="position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;height:60px;padding:0 16px;background:#000;border-bottom:1px solid #262626">
      <button onClick="{{ toggleNav }}" aria-label="Menü" style="display:flex;align-items:center;justify-content:center;width:40px;height:40px;border:1px solid #3a3a3a;border-radius:9999px;background:transparent;color:#fff">{{ iconMenu }}</button>
      <div style="display:flex;align-items:center;gap:9px">
        <span style="display:flex;color:#fff">{{ logoMark }}</span>
        <div style="display:flex;align-items:baseline;gap:3px;font-family:'Saira Condensed',sans-serif;font-size:20px;letter-spacing:4px;text-transform:uppercase;color:#fff">HEIM<span style="color:#666">DESK</span></div>
      </div>
      <div style="flex:1"></div>
      <button onClick="{{ onAiToggle }}" aria-label="Klaus öffnen" class="ai-trigger" style="display:flex;align-items:center;justify-content:center;width:40px;height:40px;border:1px solid #3a3a3a;border-radius:9999px;background:transparent;color:#fff">{{ aiIcon }}</button>
      <button onClick="{{ toggleSearch }}" aria-label="Suche" style="display:flex;align-items:center;justify-content:center;width:40px;height:40px;border:1px solid #3a3a3a;border-radius:9999px;background:transparent;color:#fff">{{ iconSearch }}</button>
    </header>
    <sc-if value="{{ searchOpen }}" hint-placeholder-val="{{ false }}">
      <div style="position:sticky;top:60px;z-index:39;padding:12px 16px;background:#000;border-bottom:1px solid #262626">
        <input class="lx-search-mobile" value="{{ searchValue }}" onInput="{{ onSearch }}" placeholder="Tickets & Wissen durchsuchen…" autofocus style="width:100%;height:44px;padding:0 0 6px;border:none;border-bottom:1px solid #3a3a3a;background:transparent;color:#fff;font-family:'Cormorant Garamond',serif;font-size:18px;outline:none"/>
      </div>
    </sc-if>
  </sc-if>

  <sc-if value="{{ navOpen }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ closeNav }}" style="position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.72);animation:hd-fade .18s ease">
      <nav onClick="{{ stop }}" class="hd-sc" style="position:absolute;top:0;left:0;bottom:0;width:280px;max-width:84vw;background:#0d0d0d;border-right:1px solid #262626;padding:22px 16px;overflow-y:auto;animation:hd-drawer .22s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:4px">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:2px 6px 18px">
          <div style="display:flex;align-items:center;gap:9px">
            <span style="display:flex;color:#fff">{{ logoMark }}</span>
            <div style="display:flex;align-items:baseline;gap:3px;font-family:'Saira Condensed',sans-serif;font-size:21px;letter-spacing:4px;text-transform:uppercase;color:#fff">HEIM<span style="color:#666">DESK</span></div>
          </div>
          <button onClick="{{ closeNav }}" aria-label="Schließen" style="display:flex;width:36px;height:36px;align-items:center;justify-content:center;border:none;background:none;color:#999">{{ iconX }}</button>
        </div>
        <sc-for list="{{ navItems }}" as="n" hint-placeholder-count="7">
          <button class="lx-nav-drawer-btn" onClick="{{ n.onClick }}" style="{{ n.drawerStyle }}"><span style="display:flex;width:20px">{{ n.icon }}</span>{{ n.label }}</button>
        </sc-for>
        <div style="height:1px;background:#262626;margin:12px 4px"></div>
        <button onClick="{{ onCreate }}" class="lx-btn" style="display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border:1px solid #fff;border-radius:9999px;background:transparent;color:#fff;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:2px;text-transform:uppercase">{{ iconPlus }} Neues Ticket</button>
        <div style="flex:1"></div>
        <div style="display:flex;align-items:center;gap:12px;padding:14px 6px 4px;border-top:1px solid #262626">
          <div style="display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:9999px;border:1px solid #3a3a3a;font-family:'JetBrains Mono',monospace;font-size:12px;color:#fff">{{ userInitials }}</div>
          <div style="line-height:1.3">
            <div style="font-family:'Saira Condensed',sans-serif;font-size:16px;letter-spacing:1px;color:#fff">{{ user }}</div>
            <button onClick="{{ toggleRole }}" style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;border:none;background:none;padding:0;color:#666">{{ roleLabel }} ↺</button>
          </div>
        </div>
      </nav>
    </div>
  </sc-if>

  <sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
    <header style="position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:32px;height:72px;padding:0 40px;background:#000;border-bottom:1px solid #262626">
      <div style="display:flex;align-items:center;gap:10px;margin-right:8px">
        <span style="display:flex;color:#fff">{{ logoMark }}</span>
        <div style="display:flex;align-items:baseline;gap:3px;font-family:'Saira Condensed',sans-serif;font-size:22px;letter-spacing:5px;text-transform:uppercase;color:#fff">HEIM<span style="color:#666">DESK</span></div>
      </div>
      <nav style="display:flex;align-items:center;gap:6px">
        <sc-for list="{{ navItems }}" as="n" hint-placeholder-count="7">
          <button class="lx-nav-btn" onClick="{{ n.onClick }}" style="{{ n.topStyle }}">{{ n.label }}</button>
        </sc-for>
      </nav>
      <div style="flex:1"></div>
      <div class="lx-search-wrap" style="position:relative;display:flex;align-items:center">
        <span class="lx-search-icon" style="position:absolute;left:2px;display:flex;pointer-events:none;color:#666">{{ iconSearch }}</span>
        <input class="lx-search" value="{{ searchValue }}" onInput="{{ onSearch }}" placeholder="SUCHEN" style="width:190px;height:40px;padding:0 0 4px 30px;border:none;border-bottom:1px solid #3a3a3a;background:transparent;color:#fff;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:2px;text-transform:uppercase;outline:none"/>
      </div>
      <button onClick="{{ onCreate }}" class="lx-btn" style="display:flex;align-items:center;gap:8px;height:42px;padding:0 26px;border:1px solid #fff;border-radius:9999px;background:transparent;color:#fff;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:2px;text-transform:uppercase">{{ iconPlus }} Ticket</button>
      <button onClick="{{ toggleRole }}" title="Rolle wechseln" class="lx-btn" style="display:flex;align-items:center;gap:10px;height:42px;padding:0 8px 0 8px;border:1px solid #3a3a3a;border-radius:9999px;background:transparent">
        <span style="display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:9999px;border:1px solid #3a3a3a;font-family:'JetBrains Mono',monospace;font-size:10px;color:#fff">{{ userInitials }}</span>
        <span style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#999;padding-right:8px">{{ roleLabel }}</span>
      </button>
      <button onClick="{{ onAiToggle }}" class="ai-trigger" title="Klaus (Strg+Leertaste)" style="display:flex;align-items:center;gap:9px;height:42px;padding:0 16px 0 12px;border:1px solid #3a3a3a;border-radius:9999px;background:transparent;color:#fff">
        {{ aiIcon }}<span style="font-family:'Saira Condensed',sans-serif;font-size:14px;letter-spacing:2px;text-transform:uppercase">Klaus</span>
      </button>
    </header>
  </sc-if>

  <main class="hd-sc lx-main">{{ screen }}</main>

  {{ overlays }}
  {{ aiPanel }}

  <button onClick="{{ onReload }}" title="{{ reloadTitle }}" aria-label="Daten neu laden" class="lx-fab" style="{{ fabStyle }}">{{ reloadIcon }}</button>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;100%&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#c3d9f3&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Stil&quot;}}">
class Component extends DCLogic {
  DB_KEY='heimdesk_db_v1'; UI_KEY='heimdesk_ui_v1'; SYNC_CFG_KEY='heimdesk_sync_v1'; SYNC_META_KEY='heimdesk_sync_meta_v1';
  AI_CFG_KEY='heimdesk_ai_cfg_v1'; AI_HIST_KEY='heimdesk_ai_history_v1';

  C={ink:'#ffffff',canvas:'#000000',soft:'#0d0d0d',card:'#141414',elev:'#1f1f1f',
     body:'#cccccc',bodyStrong:'#e6e6e6',muted:'#999999',mutedSoft:'#666666',
     line:'#262626',lineStrong:'#3a3a3a',link:'#c3d9f3',warning:'#d4a017',danger:'#c0553f',success:'#5fa657',
     disp:"'Saira Condensed',sans-serif",serif:"'Cormorant Garamond',Garamond,serif",mono:"'JetBrains Mono',ui-monospace,monospace"};
  get accent(){return this.props.accent||'#c3d9f3';}

  STATUS={new:{label:'Neu',open:true,dot:'#c3d9f3'},in_progress:{label:'In Bearbeitung',open:true,dot:'#ffffff'},assigned:{label:'Zugewiesen',open:true,dot:'#999999'},paused:{label:'Pausiert',open:true,dot:'#d4a017'},resolved:{label:'Gelöst',open:true,dot:'#5fa657'},closed:{label:'Geschlossen',open:false,dot:'#666666'}};
  STATUS_ORDER=['new','in_progress','assigned','paused','resolved','closed'];
  TYPES={ticket:{label:'Ticket',prefix:'TIC'},incident:{label:'Incident',prefix:'INC'},service_request:{label:'Service Request',prefix:'SR'},problem:{label:'Problem',prefix:'PRB'},task:{label:'Task',prefix:'TSK'},change:{label:'Change',prefix:'CHG'}};
  TYPE_ORDER=['ticket','incident','service_request','problem','task','change'];
  PRIORITY={low:{label:'Niedrig',reaction:24,resolution:72,rank:1,dot:'#666666'},medium:{label:'Mittel',reaction:8,resolution:24,rank:2,dot:'#999999'},high:{label:'Hoch',reaction:4,resolution:8,rank:3,dot:this.C.warning},critical:{label:'Kritisch',reaction:1,resolution:4,rank:4,dot:this.C.danger}};
  PRIORITY_ORDER=['low','medium','high','critical'];
  TRANSFORM={ticket:['incident','service_request','problem','change','task'],incident:['problem','change','task','service_request'],service_request:['task','change','incident'],problem:['change','task','incident'],task:['incident','change'],change:['task','problem']};

  state={db:null,ui:null,toasts:[],sync:{configured:false,status:'disabled',lastAt:null,error:null},modal:null,mf:{},undo:null,mobile:false,navOpen:false,searchOpen:false,reloading:false,lastReload:null,det:{comment:''},listLoading:true,viewLoading:false,pushes:[],spin:0,vvh:(typeof window!=='undefined'?window.innerHeight:800),vvTop:0,
    aiOpen:false,aiInput:'',aiThinking:false,aiStreamText:'',aiConvo:[],aiConvoId:null,aiPendingConfirm:null,aiHistoryOpen:false,aiHistQuery:'',aiVoice:'idle',aiWakeOn:false,aiCfg:null,aiError:null};

  /* ---------- load / persist ---------- */
  migrateDB(d){if(d&&!Array.isArray(d.todos))d.todos=[];return d;}
  _loadDB(){try{const r=localStorage.getItem(this.DB_KEY);if(r){const d=JSON.parse(r);if(d&&d.tickets)return this.migrateDB(d);}}catch(e){}return this.seed(Date.now());}
  _loadUI(){const def={view:'dashboard',role:'agent',user:'Alex',filters:{},quick:null,sort:{key:'createdAt',dir:-1},remember:true,searchQuery:'',createPrefill:null};try{const r=localStorage.getItem(this.UI_KEY);if(r){const u=JSON.parse(r);if(u&&u.view)return {...def,...u};}}catch(e){}return def;}
  persistDB(db){try{localStorage.setItem(this.DB_KEY,JSON.stringify(db));}catch(e){}}
  persistUI(ui){try{localStorage.setItem(this.UI_KEY,JSON.stringify(ui));}catch(e){}}

  constructor(p){super(p);this.state.db=this._loadDB();this.state.ui=this._loadUI();
    const cfg=this._loadSyncCfg();this.cfg=cfg;this.meta=this._loadSyncMeta();this.dirty=false;this.pushTimer=null;
    this.state.sync={configured:!!cfg,status:cfg?'idle':'disabled',lastAt:null,error:null};

  pause(uid,v){this.update((n,f)=>{const t=f(uid);if(!t)return;const days=v.days||n.settings.pauseReactivationDays;t.pausedUntil=Date.now()+days*86400000;this.logChange(t,this.state.ui.user,t.status,'paused',(v.note?v.note+'\n':'')+'Reaktivierung in '+days+ ' Tagen.');t.status='paused';t.updatedAt=Date.now();});}
  transform(uid,v){this.update((n,f)=>{const t=f(uid);if(!t)return;const from=t.type;t.type=v.type;t.journal.push({ts:Date.now(),author:this.state.ui.user,kind:'status',text:'Transformiert: '+this.TYPES[from].label+' → '+this.TYPES[v.type].label+(v.note?'\n'+v.note:'')});t.updatedAt=Date.now();});}
  editTicket(uid,patch){this.update((n,f)=>{const t=f(uid);if(!t)return;Object.assign(t,patch);t.updatedAt=Date.now();this.logComment(t,this.state.ui.user,'Ticket-Details bearbeitet.');});}
  deleteTicket(uid){const snap=structuredClone(this.state.db.tickets.find(t=>t.uid===uid));const id=snap?this.displayId(snap):'';this.update(next=>{const i=next.tickets.findIndex(t=>t.uid===uid);if(i>-1)next.tickets.splice(i,1);});if(this.state.ui.current===uid)this.go('list');this.showUndo('Ticket '+id+' gelöscht',()=>{if(snap)this.update(next=>next.tickets.push(structuredClone(snap)));});}
  withdraw(uid,reason){this.update((n,f)=>{const t=f(uid);if(!t)return;t.withdrawReason=reason;this.logChange(t,this.state.ui.user,t.status,'closed','Zurückgezogen: '+reason);t.status='closed';t.closedAt=Date.now();t.updatedAt=Date.now();});}
  reopen(uid,reason){this.update((n,f)=>{const t=f(uid);if(!t)return;t.reopenReason=reason;this.logChange(t,this.state.ui.user,t.status,'new','Wiedereröffnet: '+reason);t.status='new';t.closedAt=null;t.resolvedAt=null;t.updatedAt=Date.now();});}
  solveClose(uid,solution){this.update((n,f)=>{const t=f(uid);if(!t)return;t.solution=solution;this.logChange(t,this.state.ui.user,t.status,'resolved','Lösung dokumentiert:\n'+solution);t.status='resolved';t.resolvedAt=Date.now();t.updatedAt=Date.now();});this.toast('Als gelöst markiert.','ok');}
  confirmResolved(uid){this.update((n,f)=>{const t=f(uid);if(!t)return;this.logChange(t,this.state.ui.user,'resolved','closed','Lösung bestätigt.');t.status='closed';t.closedAt=Date.now();t.updatedAt=Date.now();});}
  rate(uid,r){this.update((n,f)=>{const t=f(uid);if(!t)return;t.rating=r;this.logComment(t,this.state.ui.user,'Bewertung: '+r.stars+'/5'+(r.comment?' – '+r.comment:''));t.updatedAt=Date.now();});this.toast('Danke für die Bewertung!','ok');}
  addKB(title,category,body){this.update(next=>next.kb.push({id:'K'+Date.now().toString(36),title,category,versions:[{v:1,date:Date.now(),author:this.state.ui.user,body}]}));this.toast('Artikel angelegt.','ok');}
  addKBVersion(id,body){this.update(next=>{const a=next.kb.find(x=>x.id===id);if(!a)return;const last=a.versions[a.versions.length-1];a.versions.push({v:last.v+1,date:Date.now(),author:this.state.ui.user,body});});this.toast('Neue Version gespeichert.','ok');}
  addService(s){this.update(next=>next.services.push({id:'S'+Date.now().toString(36),...s}));this.toast('Service angelegt.','ok');}
  addAsset(a){this.update(next=>next.assets.push({id:'A'+Date.now().toString(36),...a}));this.toast('Asset angelegt.','ok');}
  parseDateInput(v){if(!v)return null;const t=new Date(v+'T00:00:00').getTime();return isNaN(t)?null:t;}
  dateInputVal(ts){return ts?new Date(ts).toISOString().slice(0,10):'';}
  addTodo(data){if(!data.title||!data.title.trim()){this.toast('Titel fehlt.','err');return;}let created=null;this.update(next=>{if(!Array.isArray(next.todos))next.todos=[];created={id:'D'+Date.now().toString(36),title:data.title.trim(),description:data.description||'',createdAt:Date.now(),dueAt:this.parseDateInput(data.dueAt),priority:data.priority||'medium',author:this.state.ui.user,done:false};next.todos.push(created);});this.toast('ToDo hinzugefügt.','ok');if(created)this.notifyCreatedTodo(created);}
  updateTodo(id,patch){this.update(next=>{const t=(next.todos||[]).find(x=>x.id===id);if(t)Object.assign(t,patch);});this.toast('ToDo gespeichert.','ok');}
  toggleTodoDone(id){this.update(next=>{const t=(next.todos||[]).find(x=>x.id===id);if(t)t.done=!t.done;});}
  deleteTodo(id){const snap=structuredClone((this.state.db.todos||[]).find(x=>x.id===id));this.update(next=>{next.todos=(next.todos||[]).filter(x=>x.id!==id);});this.showUndo('ToDo gelöscht',()=>{if(snap)this.update(next=>{if(!Array.isArray(next.todos))next.todos=[];next.todos.push(structuredClone(snap));});});}
  setSetting(k,v){this.update(next=>{next.settings[k]=v;});}
  addToList(key,val){if(!val)return;this.update(next=>{if(!next[key].includes(val))next[key].push(val);});}
  removeFromList(key,idx){this.update(next=>next[key].splice(idx,1));}
  runAutomationNow(){this.update(next=>this.runAutomation(next));this.toast('Automatik ausgeführt.','ok');}
  exportData(){const blob=new Blob([JSON.stringify(this.state.db,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='heimdesk-export.json';a.click();}
  importData(file){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.tickets)throw 0;this.migrateDB(d);this.persistDB(d);this.setState({db:d});this.markLocalChange();this.toast('Import erfolgreich.','ok');this.go('list');}catch(e){this.toast('Ungültige Datei.','err');}};r.readAsText(file);}
  resetAll(){if(!confirm('Wirklich ALLE Daten löschen und Beispieldaten wiederherstellen?'))return;const fresh=this.seed(Date.now());this.persistDB(fresh);this.setState({db:fresh});this.markLocalChange();this.toast('Zurückgesetzt.','ok');this.go('dashboard');}

  /* ---------- sync ---------- */
  _loadSyncCfg(){try{const r=localStorage.getItem(this.SYNC_CFG_KEY);if(r){const c=JSON.parse(r);if(c&&c.url&&c.anonKey&&c.code)return c;}}catch(e){}return null;}
  _saveSyncCfg(c){try{if(c)localStorage.setItem(this.SYNC_CFG_KEY,JSON.stringify(c));else localStorage.removeItem(this.SYNC_CFG_KEY);}catch(e){}}
  _loadSyncMeta(){try{const r=localStorage.getItem(this.SYNC_META_KEY);if(r){const m=JSON.parse(r);if(m&&typeof m.updatedAt==='number')return m;}}catch(e){}return{updatedAt:0};}
  _saveSyncMeta(m){try{localStorage.setItem(this.SYNC_META_KEY,JSON.stringify(m));}catch(e){}}
  isOnline(){return typeof navigator==='undefined'?true:navigator.onLine;}
  generateSyncCode(){const b=new Uint8Array(18);crypto.getRandomValues(b);return btoa(String.fromCharCode(...b)).replace(/[+/=]/g,'').slice(0,24);}
  async hashCode(code){const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('heimdesk:'+code));return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');}
  normUrl(u){return u.trim().replace(/\/+$/,'').replace(/\/rest\/v1$/i,'').replace(/\/+$/,'');}
  syncHeaders(cfg){return{apikey:cfg.anonKey,Authorization:'Bearer '+cfg.anonKey,'Content-Type':'application/json'};}
  async pull(cfg){const h=await this.hashCode(cfg.code);const res=await fetch(this.normUrl(cfg.url)+'/rest/v1/rpc/heimdesk_get',{method:'POST',headers:this.syncHeaders(cfg),body:JSON.stringify({p_code_hash:h})});if(!res.ok)throw new Error('Pull ('+res.status+')');const rows=await res.json();const row=Array.isArray(rows)?rows[0]:rows;if(!row||!row.data)return null;return{data:row.data,updatedAt:Number(row.updated_at)||0};}
  async pushRemote(cfg,data,updatedAt){const h=await this.hashCode(cfg.code);const res=await fetch(this.normUrl(cfg.url)+'/rest/v1/rpc/heimdesk_set',{method:'POST',headers:this.syncHeaders(cfg),body:JSON.stringify({p_code_hash:h,p_data:data,p_updated_at:updatedAt})});if(!res.ok)throw new Error('Push ('+res.status+')');}
  adoptRemote(data,updatedAt){this.meta={updatedAt};this._saveSyncMeta(this.meta);this.dirty=false;this.migrateDB(data);this.persistDB(data);this.setState({db:data});}
  async flushPush(){const cfg=this.cfg;if(!cfg||!this.dirty)return;if(!this.isOnline()){this.setState(s=>({sync:{...s.sync,status:'offline'}}));return;}this.setState(s=>({sync:{...s.sync,status:'syncing',error:null}}));try{await this.pushRemote(cfg,this.state.db,this.meta.updatedAt);this.dirty=false;this.setState(s=>({sync:{...s.sync,status:'ok',lastAt:Date.now(),error:null}}));}catch(e){this.setState(s=>({sync:{...s.sync,status:'error',error:String(e.message||e)}}));}}
  markLocalChange(){if(!this.cfg)return;this.meta={updatedAt:Date.now()};this._saveSyncMeta(this.meta);this.dirty=true;if(this.pushTimer)clearTimeout(this.pushTimer);this.pushTimer=setTimeout(()=>this.flushPush(),1500);}
  async runStartupSync(){const cfg=this.cfg;if(!cfg)return;if(!this.isOnline()){this.setState(s=>({sync:{...s.sync,status:'offline'}}));return;}this.setState(s=>({sync:{...s.sync,status:'syncing',error:null}}));try{const remote=await this.pull(cfg);if(remote&&remote.updatedAt>this.meta.updatedAt){this.adoptRemote(remote.data,remote.updatedAt);}else if(!remote||this.dirty||remote.updatedAt<this.meta.updatedAt){this.dirty=true;await this.flushPush();return;}this.setState(s=>({sync:{...s.sync,status:'ok',lastAt:Date.now(),error:null}}));}catch(e){this.setState(s=>({sync:{...s.sync,status:'error',error:String(e.message||e)}}));}}
  async configureSync(cfg){const clean={url:(cfg.url||'').trim(),anonKey:(cfg.anonKey||'').trim(),code:(cfg.code||'').trim()};if(!clean.url||!clean.anonKey||!clean.code){this.toast('Bitte URL, Anon-Key und Sync-Code angeben.','err');return;}this.cfg=clean;this._saveSyncCfg(clean);this.setState({sync:{configured:true,status:'syncing',lastAt:null,error:null}});try{const remote=await this.pull(clean);if(remote){this.adoptRemote(remote.data,remote.updatedAt);}else{this.meta={updatedAt:Date.now()};this._saveSyncMeta(this.meta);await this.pushRemote(clean,this.state.db,this.meta.updatedAt);this.dirty=false;}this.setState({sync:{configured:true,status:'ok',lastAt:Date.now(),error:null}});this.toast('Cloud-Sync verbunden.','ok');}catch(e){const msg=String(e.message||e);this.setState({sync:{configured:true,status:'error',lastAt:null,error:msg}});this.toast('Sync fehlgeschlagen: '+msg,'err');}}
  async syncNow(){if(!this.cfg)return;if(this.dirty)await this.flushPush();else await this.runStartupSync();}
  disconnectSync(){this.cfg=null;this._saveSyncCfg(null);this.dirty=false;this.setState({sync:{configured:false,status:'disabled',lastAt:null,error:null}});this.toast('Cloud-Sync getrennt.','ok');}

  /* ================================================================
     APHELIOS — KI-Assistent
     Aufgeteilt in klar getrennte Bereiche (Ersatz für services/*-Ordner,
     da diese Single-File-App keinen Bundler hat):
       AI.config    - Ein-/Ausschalten, Spracheinstellungen (localStorage)
       AI.history   - Unterhaltungsverlauf (localStorage, Liste/Suche/Export)
       AI.context   - aktueller App-Zustand für die KI (Seite, Nutzer, Ticket…)
       AI.rag       - lokale Stichwortsuche über Wissensartikel + Hilfetexte
       AI.tools     - Funktionsaufrufe, die die KI ausführen darf
       AI.chat      - Streaming-Anfrage an die Supabase Edge Function
       AI.voice     - Wake-Word, Spracheingabe, Sprachausgabe
     Die Edge Function (supabase/functions/aphelios-chat) kennt keine
     Tickets/ToDos - sie ist nur ein sicherer Anthropic-Relay. Alle Tool-
     Aufrufe werden hier im Browser ausgeführt, mit denselben Methoden
     (createTicket, assign, …) und damit denselben Rollen-/Sichtbarkeits-
     Regeln wie die restliche App.
     ================================================================ */

  /* ---------- AI.config ---------- */
  _loadAiCfg(){const def={enabled:false,voiceEnabled:false,wakeWordEnabled:false,model:'claude-sonnet-5'};try{const r=localStorage.getItem(this.AI_CFG_KEY);if(r){const c=JSON.parse(r);if(c)return{...def,...c};}}catch(e){}return def;}
  _saveAiCfg(c){try{localStorage.setItem(this.AI_CFG_KEY,JSON.stringify(c));}catch(e){}}
  setAiCfg(patch){const next={...this.state.aiCfg,...patch};this.setState({aiCfg:next});this._saveAiCfg(next);
    if(patch.wakeWordEnabled===false)this.aiStopWakeListening();
    if(patch.wakeWordEnabled===true&&patch.voiceEnabled!==false&&this.state.aiCfg.voiceEnabled)this.aiStartWakeListening();}
  aiFunctionUrl(){if(!this.cfg)return null;return this.normUrl(this.cfg.url)+'/functions/v1/aphelios-chat';}

  /* ---------- AI.history ---------- */
  _loadAiHistory(){try{const r=localStorage.getItem(this.AI_HIST_KEY);if(r){const h=JSON.parse(r);if(Array.isArray(h))return h;}}catch(e){}return[];}
  _saveAiHistory(list){try{localStorage.setItem(this.AI_HIST_KEY,JSON.stringify(list.slice(0,100)));}catch(e){}}
  aiNewConversation(){this.setState({aiConvo:[],aiConvoId:null,aiStreamText:'',aiPendingConfirm:null,aiHistoryOpen:false});}
  aiPersistConvo(){if(!this.state.aiConvo.length)return;const list=this._loadAiHistory();const id=this.state.aiConvoId||('ac_'+Date.now().toString(36));
    const title=(this.state.aiConvo.find(m=>m.role==='user')||{}).text||'Unterhaltung';
    const entry={id,title:title.slice(0,60),createdAt:list.find(x=>x.id===id)?.createdAt||Date.now(),updatedAt:Date.now(),messages:this.state.aiConvo};
    const idx=list.findIndex(x=>x.id===id);if(idx>-1)list[idx]=entry;else list.unshift(entry);
    this._saveAiHistory(list);if(!this.state.aiConvoId)this.setState({aiConvoId:id});}
  aiLoadConversation(id){const list=this._loadAiHistory();const c=list.find(x=>x.id===id);if(!c)return;this.setState({aiConvo:c.messages,aiConvoId:c.id,aiHistoryOpen:false,aiStreamText:'',aiPendingConfirm:null});}
  aiDeleteConversation(id){this._saveAiHistory(this._loadAiHistory().filter(x=>x.id!==id));if(this.state.aiConvoId===id)this.aiNewConversation();this.forceUpdate();}
  aiExportConversation(id){const c=this._loadAiHistory().find(x=>x.id===id);if(!c)return;const blob=new Blob([JSON.stringify(c,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='klaus-'+c.id+'.json';a.click();}

  /* ---------- AI.context ---------- */
  aiGatherContext(){const ui=this.state.ui,db=this.state.db;
    const t=(ui.view==='detail'&&ui.current)?db.tickets.find(x=>x.uid===ui.current):null;
    return{page:ui.view,user:ui.user,role:ui.role,
      selectedTicket:t?{id:this.displayId(t),uid:t.uid,summary:t.summary,status:t.status,priority:t.priority,responsibleUser:t.responsibleUser}:null,
      filters:ui.filters||{},quick:ui.quick||null,searchQuery:ui.searchQuery||'',modalOpen:this.state.modal?this.state.modal.kind:null,
      openTicketCount:this.selectVisible().filter(x=>this.STATUS[x.status].open).length,
      openTodoCount:(db.todos||[]).filter(x=>!x.done).length};}

  /* ---------- AI.rag: leichte Stichwortsuche über Wissensartikel + feste Hilfetexte ---------- */
  aiHelpDocs(){return[
    {title:'Suche benutzen',body:'Die Suchleiste oben (Lupe) durchsucht Tickets und Wissensartikel gleichzeitig nach Stichworten in Betreff, Beschreibung, Kategorie und Verlauf. Ergebnisse erscheinen sofort auf der Seite „Suche".'},
    {title:'Ticket anlegen',body:'Über den Button „Neues Ticket" (Übersicht oder Tickets-Liste) öffnet sich ein Formular für Betreff, Beschreibung, Typ, Priorität, Kategorie, Betroffene Person und optional Verantwortliche/n.'},
    {title:'Nutzer wechseln',body:'Unter Setup → „Angemeldet als" lässt sich der aktive Nutzer und die Rolle (Agent/Nutzer) wechseln. Als Agent sieht man alle Tickets, als Nutzer nur eigene gemeldete oder zugewiesene.'},
    {title:'Priorität und SLA',body:'Jede Priorität (Niedrig/Mittel/Hoch/Kritisch) hat eigene Reaktions- und Lösungsfristen. Läuft die Frist bald ab oder ist sie überschritten, erscheint ein farblicher Hinweis am Ticket.'},
    {title:'Cloud-Sync einrichten',body:'Unter Setup → „Cloud-Sync" lässt sich eine eigene Supabase-Instanz verbinden (URL, Anon-Key, Sync-Code), um Daten geräteübergreifend abzugleichen.'},
    {title:'Benachrichtigungen',body:'Unter Setup → „Benachrichtigungen" lassen sich System-Hinweise zu auslaufenden Tickets und fälligen ToDos aktivieren.'},
    {title:'ToDo-Liste',body:'Im Tab „ToDo" lassen sich eigene Aufgaben mit Titel, Fälligkeitsdatum, Priorität und Ersteller anlegen, abhaken und bearbeiten.'},
  ];}
  aiScoreDoc(query,text){const q=query.toLowerCase().split(/\s+/).filter(w=>w.length>2);if(!q.length)return 0;const t=text.toLowerCase();let s=0;q.forEach(w=>{if(t.includes(w))s+=1;});return s/q.length;}
  aiRetrieve(query,k){const docs=[...this.aiHelpDocs().map(d=>({...d,kind:'help'})),
      ...this.state.db.kb.map(a=>({title:a.title,body:a.versions[a.versions.length-1].body,kind:'kb',category:a.category}))];
    return docs.map(d=>({...d,score:this.aiScoreDoc(query,d.title+' '+d.body)})).filter(d=>d.score>0).sort((a,b)=>b.score-a.score).slice(0,k||3);}

  /* ---------- AI.tools: Werkzeuge, die die KI aufrufen darf ---------- */
  AI_DESTRUCTIVE=['deleteTicket','deleteTodo'];
  aiResolveTicket(ref){const db=this.state.db;if(!ref){const ctx=this.aiGatherContext();if(ctx.selectedTicket)return db.tickets.find(t=>t.uid===ctx.selectedTicket.uid);return null;}
    const byUid=db.tickets.find(t=>t.uid===ref);if(byUid)return byUid;
    const clean=String(ref).toUpperCase().replace(/\s+/g,'');return db.tickets.find(t=>this.displayId(t).toUpperCase().replace(/\s+/g,'')===clean)||null;}
  aiResolveTodo(ref){const list=this.state.db.todos||[];if(!ref)return null;const byId=list.find(t=>t.id===ref);if(byId)return byId;
    const ql=String(ref).toLowerCase();return list.find(t=>t.title.toLowerCase().includes(ql))||null;}

  aiIsDestructive(name){return this.AI_DESTRUCTIVE.includes(name);}
  aiExecuteTool(name,input){input=input||{};
    switch(name){
      case 'createTicket':{const uid=this.createTicket({summary:input.summary,description:input.description||'',category:input.category,priority:input.priority,type:input.type,affectedUser:input.affectedUser,responsibleUser:input.responsibleUser});

      case 'updateTicketPriority':{const t=this.aiResolveTicket(input.ticketRef);if(!t)return{ok:false,message:'Ticket nicht gefunden.'};this.update((n,f)=>{const x=f(t.uid);if(x){x.priority=input.priority;x.updatedAt=Date.now();}});return{ok:true,message:'Priorität von '+this.displayId(t)+' → '+this.PRIORITY[input.priority].label+'.'};}
      case 'assignTicket':{const t=this.aiResolveTicket(input.ticketRef);if(!t)return{ok:false,message:'Ticket nicht gefunden.'};const user=this.state.db.users.find(u=>u.toLowerCase()===String(input.responsibleUser||'').toLowerCase())||input.responsibleUser;this.assign(t.uid,{responsibleUser:user,responsibleRole:null});return{ok:true,message:this.displayId(t)+' an '+user+' zugewiesen.'};}
      case 'addTicketComment':{const t=this.aiResolveTicket(input.ticketRef);if(!t)return{ok:false,message:'Ticket nicht gefunden.'};this.addComment(t.uid,input.text);return{ok:true,message:'Kommentar zu '+this.displayId(t)+' hinzugefügt.'};}
      case 'deleteTicket':{const t=this.aiResolveTicket(input.ticketRef);if(!t)return{ok:false,message:'Ticket nicht gefunden.'};this.deleteTicket(t.uid);return{ok:true,message:'Ticket '+this.displayId(t)+' gelöscht.'};}
      case 'searchTickets':{let list=this.selectVisible();if(input.status)list=list.filter(t=>t.status===input.status);if(input.priority)list=list.filter(t=>t.priority===input.priority);if(input.category)list=list.filter(t=>t.category===input.category);if(input.affectedUser)list=list.filter(t=>t.affectedUser.toLowerCase()===String(input.affectedUser).toLowerCase());if(input.query)list=list.filter(t=>this.ticketMatches(t,input.query));
        const items=list.slice(0,8).map(t=>this.displayId(t)+' — '+t.summary+' ('+this.STATUS[t.status].label+', '+this.PRIORITY[t.priority].label+')');
        return{ok:true,message:list.length+' Ticket(s) gefunden.',items,count:list.length};}
      case 'createTodo':{let created=null;const orig=this.addTodo.bind(this);this.update(next=>{if(!Array.isArray(next.todos))next.todos=[];created={id:'D'+Date.now().toString(36),title:(input.title||'').trim(),description:input.description||'',createdAt:Date.now(),dueAt:this.parseDateInput(input.dueAt),priority:input.priority||'medium',author:this.state.ui.user,done:false};next.todos.push(created);});if(created)this.notifyCreatedTodo&&this.notifyCreatedTodo(created);return{ok:true,message:'ToDo „'+(created&&created.title)+'" angelegt.'};}
      case 'updateTodo':{const td=this.aiResolveTodo(input.todoRef);if(!td)return{ok:false,message:'ToDo nicht gefunden.'};const patch={};if(input.title)patch.title=input.title;if(input.description!==undefined)patch.description=input.description;if(input.dueAt)patch.dueAt=this.parseDateInput(input.dueAt);if(input.priority)patch.priority=input.priority;this.update(next=>{const x=(next.todos||[]).find(t=>t.id===td.id);if(x)Object.assign(x,patch);});return{ok:true,message:'ToDo „'+td.title+'" aktualisiert.'};}
      case 'toggleTodoDone':{const td=this.aiResolveTodo(input.todoRef);if(!td)return{ok:false,message:'ToDo nicht gefunden.'};this.update(next=>{const x=(next.todos||[]).find(t=>t.id===td.id);if(x)x.done=!x.done;});return{ok:true,message:'ToDo „'+td.title+'" '+(td.done?'wieder geöffnet.':'als erledigt markiert.')};}
      case 'deleteTodo':{const td=this.aiResolveTodo(input.todoRef);if(!td)return{ok:false,message:'ToDo nicht gefunden.'};this.update(next=>{next.todos=(next.todos||[]).filter(t=>t.id!==td.id);});return{ok:true,message:'ToDo „'+td.title+'" gelöscht.'};}
      case 'searchTodos':{let list=this.state.db.todos||[];if(input.priority)list=list.filter(t=>t.priority===input.priority);if(typeof input.done==='boolean')list=list.filter(t=>!!t.done===input.done);if(input.query){const ql=input.query.toLowerCase();list=list.filter(t=>t.title.toLowerCase().includes(ql)||(t.description||'').toLowerCase().includes(ql));}
        const items=list.slice(0,8).map(t=>t.title+' ('+this.PRIORITY[t.priority].label+(t.done?', erledigt':'')+')');

      case 'navigate':{this.go(input.page);return{ok:true,message:'Zu „'+input.page+'" gewechselt.'};}
      case 'showStatistics':{const list=this.selectVisible();const esc=this.state.db.settings.escalationDays;
        const open=list.filter(t=>this.STATUS[t.status].open).length;const escalated=list.filter(t=>this.isEscalated(t,esc)).length;
        const wk=Date.now()-7*86400000;const resolvedWk=list.filter(t=>(t.resolvedAt&&t.resolvedAt>=wk)||(t.closedAt&&t.closedAt>=wk)).length;

    }}
  aiToolConfirmLabel(name,input){

  /* ---------- AI.chat: System-Prompt, Streaming-Request, Tool-Calling-Schleife ---------- */
  aiSystemPrompt(retrieved){const ctx=this.aiGatherContext();
    let s='Du bist Klaus, der freundliche, professionelle KI-Assistent von HeimDesk (Ticket- und ToDo-Verwaltung). '
      +'Antworte auf Deutsch, kurz und klar; erkläre nur ausführlich, wenn ausdrücklich danach gefragt wird. '
      +'Nutze die bereitgestellten Werkzeuge, um echte Aktionen auszuführen, statt sie nur zu beschreiben. '
      +'Wenn eine wichtige Angabe fehlt (z. B. Betreff oder Priorität beim Anlegen), frage kurz nach statt zu raten. '
      +'Löschen/Archivieren wird vom System automatisch mit einer Bestätigungsfrage abgesichert - führe es einfach über das Werkzeug aus. '
      +'Wörter wie "dieses Ticket" oder "das" beziehen sich auf den aktuellen Kontext unten.\n\nAktueller Kontext:\n'+JSON.stringify(ctx);
    if(retrieved&&retrieved.length)s+='\n\nRelevante interne Hilfe-/Wissensartikel (bei Bedarf kurz zitieren):\n'+retrieved.map(d=>'- '+d.title+': '+d.body).join('\n');
    return s;}
  async aiStreamRequest(body,onTextDelta){const url=this.aiFunctionUrl();
    const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json',apikey:this.cfg.anonKey,Authorization:'Bearer '+this.cfg.anonKey},body:JSON.stringify(body)});
    if(!res.ok||!res.body){const t=await res.text().catch(()=>'');let msg='HTTP '+res.status;try{const j=JSON.parse(t);if(j.error)msg=j.error;}catch(e){}throw new Error(msg);}
    const reader=res.body.getReader(),decoder=new TextDecoder();let buf='';const blocks=[];let stopReason=null;
    while(true){const{done,value}=await reader.read();if(done)break;buf+=decoder.decode(value,{stream:true});let idx;
      while((idx=buf.indexOf('\n\n'))>=0){const chunk=buf.slice(0,idx);buf=buf.slice(idx+2);
        let ev=null,dataStr='';chunk.split('\n').forEach(l=>{if(l.startsWith('event:'))ev=l.slice(6).trim();else if(l.startsWith('data:'))dataStr+=l.slice(5).trim();});
        if(!dataStr)continue;let data;try{data=JSON.parse(dataStr);}catch(e){continue;}
        if(ev==='content_block_start'){blocks[data.index]=data.content_block.type==='tool_use'?{type:'tool_use',id:data.content_block.id,name:data.content_block.name,inputJson:''}:{type:'text',text:''};}
        else if(ev==='content_block_delta'){const b=blocks[data.index];if(!b)continue;
          if(data.delta.type==='text_delta'){b.text+=data.delta.text;onTextDelta(blocks.filter(Boolean).map(x=>x.type==='text'?x.text:'').join(''));}
          else if(data.delta.type==='input_json_delta')b.inputJson+=data.delta.partial_json;}
        else if(ev==='message_delta'){if(data.delta&&data.delta.stop_reason)stopReason=data.delta.stop_reason;}
        else if(ev==='error'){throw new Error((data.error&&data.error.message)||'Stream-Fehler');}
      }}
    // Leere Text-Blöcke (Claude sendet vor einem reinen Tool-Aufruf gelegentlich einen Text-Block,
    // der nie ein Delta bekommt) rausfiltern - sonst landet {type:'text',text:''} dauerhaft im
    // Gesprächsverlauf und Anthropic lehnt JEDE folgende Anfrage mit "text content blocks must be
    // non-empty" ab, bis die Unterhaltung neu gestartet wird.
    return{blocks:blocks.filter(Boolean).map(b=>b.type==='tool_use'?{type:'tool_use',id:b.id,name:b.name,input:(()=>{try{return JSON.parse(b.inputJson||'{}');}catch(e){return{};}})()}:{type:'text',text:b.text}).filter(b=>b.type!=='text'||b.text.trim()),stopReason};}
  aiPushDisplay(msg){this.setState(s=>({aiConvo:[...s.aiConvo,{ts:Date.now(),...msg}]}));}
  aiSendTyped(userText){this._aiVoiceTurn=false;this.aiSend(userText);}
  async aiSend(userText){if(!userText||!userText.trim())return;
    if(!this.cfg){this.aiPushDisplay({role:'system',text:'Bitte zuerst Cloud-Sync in den Einstellungen einrichten (Klaus nutzt dieselbe Supabase-Verbindung).'});return;}
    userText=userText.trim();this._aiRaw=this._aiRaw||[];
    this._aiRaw.push({role:'user',content:userText});
    this.aiPushDisplay({role:'user',text:userText});
    this.setState({aiThinking:true,aiStreamText:'',aiError:null,aiInput:''});
    await this.aiRunLoop();}
  async aiRunLoop(){const retrieved=this.aiRetrieve((this._aiRaw[this._aiRaw.length-1]&&typeof this._aiRaw[this._aiRaw.length-1].content==='string')?this._aiRaw[this._aiRaw.length-1].content:'',3);
    const system=this.aiSystemPrompt(retrieved);const tools=this.AI_TOOL_DEFS();
    let hops=0;const MAX_HOPS=4;
    try{
      while(hops<MAX_HOPS){hops++;
        const{blocks,stopReason}=await this.aiStreamRequest({messages:this._aiRaw,system,tools,model:this.state.aiCfg.model},txt=>this.setState({aiStreamText:txt}));
        this._aiRaw.push({role:'assistant',content:blocks});
        const textPart=blocks.filter(b=>b.type==='text').map(b=>b.text).join('').trim();
        const toolCalls=blocks.filter(b=>b.type==='tool_use');
        if(textPart)this.aiPushDisplay({role:'assistant',text:textPart,citations:retrieved.map(r=>r.title)});
        this.setState({aiStreamText:''});
        if(!toolCalls.length){this.setState({aiThinking:false});if(this._aiVoiceTurn)await this.aiSpeak(textPart);this.aiPersistConvo();return;}
        const destructive=toolCalls.find(tc=>this.aiIsDestructive(tc.name));
        if(destructive){this.setState({aiThinking:false,aiPendingConfirm:{toolUseId:destructive.id,name:destructive.name,input:destructive.input,otherCalls:toolCalls.filter(tc=>tc!==destructive)}});return;}
        const results=toolCalls.map(tc=>{const r=this.aiExecuteTool(tc.name,tc.input);return{type:'tool_result',tool_use_id:tc.id,content:JSON.stringify(r)};});
        toolCalls.forEach((tc,i)=>this.aiPushDisplay({role:'tool',text:JSON.parse(results[i].content).message,toolName:tc.name}));
        this._aiRaw.push({role:'user',content:results});
      }
      this.setState({aiThinking:false});this.aiPersistConvo();
    }catch(e){this.setState({aiThinking:false,aiStreamText:'',aiError:String(e.message||e)});this.aiPushDisplay({role:'system',text:'Fehler: '+String(e.message||e)});}}
  async aiResolveConfirm(accepted){const pc=this.state.aiPendingConfirm;if(!pc)return;this.setState({aiPendingConfirm:null,aiThinking:true});
    let result;if(accepted)result=this.aiExecuteTool(pc.name,pc.input);else result={ok:false,message:'Vom Nutzer abgebrochen.'};
    this.aiPushDisplay({role:'tool',text:result.message,toolName:pc.name});
    const results=[{type:'tool_result',tool_use_id:pc.toolUseId,content:JSON.stringify(result)}];
    (pc.otherCalls||[]).forEach(tc=>{const r=this.aiExecuteTool(tc.name,tc.input);this.aiPushDisplay({role:'tool',text:r.message,toolName:tc.name});results.push({type:'tool_result',tool_use_id:tc.id,content:JSON.stringify(r)});});
    this._aiRaw.push({role:'user',content:results});
    await this.aiRunLoop();}

  /* ---------- AI.render: Markdown/Codeblöcke/Tabellen (marked + highlight.js per CDN, wie React/Babel) ---------- */
  aiLoadMarkdownLibs(){if(this._aiLibsPromise)return this._aiLibsPromise;
    this._aiLibsPromise=new Promise(resolve=>{let remaining=2;const done=()=>{remaining--;if(remaining<=0)resolve();};
      if(window.marked){done();}else{const s=document.createElement('script');s.src='https://unpkg.com/marked@12.0.2/marked.min.js';s.onload=done;s.onerror=done;document.head.appendChild(s);}
      if(window.hljs){done();}else{const s=document.createElement('script');s.src='https://unpkg.com/@highlightjs/cdn-assets@11.10.0/highlight.min.js';
        s.onload=()=>{const l=document.createElement('link');l.rel='stylesheet';l.href='https://unpkg.com/@highlightjs/cdn-assets@11.10.0/styles/github-dark.min.css';document.head.appendChild(l);done();};s.onerror=done;document.head.appendChild(s);}});
    return this._aiLibsPromise;}
  aiSanitizeHtml(html){return String(html).replace(/<script[\s\S]*?<\/script>/gi,'').replace(/ on[a-z]+="[^"]*"/gi,'').replace(/ on[a-z]+='[^']*'/gi,'').replace(/javascript:/gi,'');}
  aiRenderMarkdown(text){const h=React.createElement;if(!text)return null;
    if(window.marked){let html;try{html=window.marked.parse(text,{breaks:true});}catch(e){html=text;}
      html=this.aiSanitizeHtml(html);
      return h('div',{className:'ai-md',dangerouslySetInnerHTML:{__html:html},ref:el=>{if(el&&window.hljs){el.querySelectorAll('pre code').forEach(b=>{if(!b.dataset.hl){try{window.hljs.highlightElement(b);}catch(e){}b.dataset.hl='1';}});}}});}
    return h('div',{className:'ai-md'},text.split('\n').map((line,i)=>h('div',{key:i},line)));}

  /* ---------- AI.voice: Wake-Word, Sprachein-/ausgabe ---------- */
  aiPickVoice(){const voices=(this._aiVoicesCache&&this._aiVoicesCache.length)?this._aiVoicesCache:(typeof speechSynthesis!=='undefined'?speechSynthesis.getVoices():[]);
    const german=voices.filter(v=>/de[-_]DE/i.test(v.lang)||/de/i.test(v.lang));
    const pool=german.length?german:voices;
    if(!pool.length)return null;
    // Cloud-/Neural-Stimmen (Google, Microsoft "Online"/"Natural", Apple "Enhanced"/"Premium") klingen
    // deutlich natürlicher als die generischen lokalen System-Stimmen (oft der Grund für "computermäßig").
    // Zusätzlich eine männliche Stimme bevorzugen (Web-Speech-API liefert kein Geschlecht als Feld,
    // daher über bekannte Vornamen gängiger Anbieter-Stimmen geschätzt).
    const maleHints=/conrad|stefan|markus|florian|daniel|michael|ralf|jonas|male\b/i;
    const femaleHints=/katja|hedda|anna|petra|vicki|marlene|female\b/i;
    const score=v=>{let s=0;if(/google/i.test(v.name))s+=4;if(/online|natural|neural/i.test(v.name))s+=4;if(/enhanced|premium/i.test(v.name))s+=3;if(!v.localService)s+=2;if(maleHints.test(v.name))s+=5;if(femaleHints.test(v.name))s-=5;return s;};
    return pool.slice().sort((a,b)=>score(b)-score(a))[0];}
  aiSpeak(text){
    // Gibt ein Promise zurück, das erst auflöst, wenn die Sprachausgabe fertig ist (oder gar nicht
    // erst startet) - Aufrufer warten damit ab, bevor sie das Mikrofon wieder aktivieren. Sonst nimmt
    // die noch laufende Erkennung die eigene KI-Antwort als vermeintlichen Nutzer-Input auf.
    return new Promise(resolve=>{
      if(!this.state.aiCfg.voiceEnabled||!text||typeof speechSynthesis==='undefined'){resolve();return;}
      try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.replace(/[*_#`]/g,''));u.lang='de-DE';u.rate=.97;u.pitch=1;
        const v=this.aiPickVoice();if(v){u.voice=v;u.lang=v.lang;}
        u.onstart=()=>this.setState({aiVoice:'speaking'});
        u.onend=()=>{this.setState({aiVoice:this.state.aiWakeOn?'wake':'idle'});resolve();};
        u.onerror=()=>{this.setState({aiVoice:this.state.aiWakeOn?'wake':'idle'});resolve();};
        speechSynthesis.speak(u);}catch(e){resolve();}
    });}
  aiSpeechSupported(){return !!(window.SpeechRecognition||window.webkitSpeechRecognition);}
  aiToggleChat(){this.setState(s=>({aiOpen:!s.aiOpen}));if(!this.state.aiOpen)this.aiLoadMarkdownLibs();}
  aiStartWakeListening(){if(this._aiWakeRecog)return;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){this.toast('Spracherkennung wird von diesem Browser nicht unterstützt (nur Chrome/Edge).','err');return;}
    const rec=new SR();rec.continuous=true;rec.interimResults=true;rec.lang='de-DE';
    rec.onresult=e=>{let t='';for(let i=e.resultIndex;i<e.results.length;i++)t+=e.results[i][0].transcript;if(/klaus/i.test(t))this.aiWakeTriggered();};
    // Fehler nicht mehr stumm schlucken: ohne dieses Feedback wirkt ein verweigerter
    // Mikrofonzugriff oder eine fehlende Internetverbindung (Spracherkennung läuft über einen
    // Cloud-Dienst) wie "Wake-Word tut einfach gar nichts", ohne erkennbaren Grund.
    rec.onerror=e=>{const err=e&&e.error;
      if(err==='not-allowed'||err==='service-not-allowed'){this.aiStopWakeListening();this.toast('Mikrofonzugriff verweigert - Wake-Word deaktiviert. Bitte in den Browser- UND System-Einstellungen (Mikrofon-Datenschutz) erlauben.','err');this.setAiCfg({wakeWordEnabled:false});return;}
      if(err==='audio-capture'){this.aiStopWakeListening();this.toast('Kein Mikrofon gefunden oder vom Betriebssystem blockiert - Wake-Word deaktiviert.','err');this.setAiCfg({wakeWordEnabled:false});return;}
      if(err==='network'){if(!this._aiWakeNetToastAt||Date.now()-this._aiWakeNetToastAt>30000){this._aiWakeNetToastAt=Date.now();this.toast('Spracherkennung braucht eine Internetverbindung.','err');}return;}
      // Kein Fehlertyp darf mehr komplett unsichtbar bleiben - sonst wirkt jeder nicht explizit
      // behandelte Fehlercode wieder wie "Wake-Word tut einfach gar nichts".
      if(err&&err!=='no-speech'&&err!=='aborted'){if(!this._aiWakeErrToastAt||Date.now()-this._aiWakeErrToastAt>30000){this._aiWakeErrToastAt=Date.now();this.toast('Wake-Word-Fehler ('+err+').','err');}}};
    rec.onend=()=>{if(this._aiWakeShouldRun){try{rec.start();}catch(e){}}};
    this._aiWakeShouldRun=true;this._aiWakeRecog=rec;this.setState({aiWakeOn:true,aiVoice:'wake'});
    try{rec.start();}catch(e){this.toast('Wake-Word konnte nicht gestartet werden.','err');}}
  aiStopWakeListening(){this._aiWakeShouldRun=false;if(this._aiWakeRecog){try{this._aiWakeRecog.stop();}catch(e){}this._aiWakeRecog=null;}
    this.setState({aiWakeOn:false});if(this.state.aiVoice==='wake')this.setState({aiVoice:'idle'});}
  aiWakeTriggered(){this.aiStopWakeListening();this.setState({aiOpen:true,aiVoice:'listening'});this.aiLoadMarkdownLibs();
    // Kurze Verzögerung vor dem Start der Befehlsaufnahme: manche Browser (v. a. Edge) geben das
    // Mikrofon der gerade gestoppten Wake-Word-Erkennung nicht sofort frei - ein sofortiger
    // start() einer zweiten Instanz bricht dann selbst sofort wieder ab ("Sprachmodus springt
    // nach 1ms wieder raus"), da nur eine aktive Aufnahme gleichzeitig möglich ist.
    setTimeout(()=>this.aiStartCommandCapture(),250);}
  aiStartCommandCapture(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;
    // Nur eine aktive Spracherkennung gleichzeitig möglich - falls der Wake-Word-Listener noch
    // läuft (z. B. manueller Mikrofon-Klick, während Wake-Word im Hintergrund lauscht), diesen erst
    // stoppen und die neue Aufnahme verzögert starten, statt sofort mit zwei Instanzen zu kollidieren.
    if(this._aiWakeRecog){this.aiStopWakeListening();setTimeout(()=>this.aiStartCommandCapture(),250);return;}
    const rec=new SR();rec.continuous=false;rec.interimResults=true;rec.lang='de-DE';let finalText='';let errMsg=null;
    rec.onresult=e=>{let interim='',fin='';for(let i=0;i<e.results.length;i++){if(e.results[i].isFinal)fin+=e.results[i][0].transcript;else interim+=e.results[i][0].transcript;}
      this.setState({aiInput:(fin+interim).trim()});if(fin)finalText=fin;};
    rec.onerror=e=>{const err=e&&e.error;
      if(err==='not-allowed'||err==='service-not-allowed')errMsg='Mikrofonzugriff verweigert. Bitte in den Browser- UND System-Einstellungen (Mikrofon-Datenschutz) erlauben.';
      else if(err==='network')errMsg='Spracherkennung braucht eine Internetverbindung.';
      else if(err==='audio-capture')errMsg='Kein Mikrofon gefunden.';
      else if(err&&err!=='no-speech'&&err!=='aborted')errMsg='Sprachaufnahme-Fehler ('+err+').';};
    rec.onend=async()=>{this.setState({aiVoice:'thinking'});const text=(finalText||this.state.aiInput||'').trim();this._aiCmdRecog=null;
      // setTimeout vor aiStartWakeListening(): dieselbe Verzögerung wie beim umgekehrten Übergang -
      // sonst startet der Wake-Listener, bevor der Browser das Mikrofon der gerade beendeten
